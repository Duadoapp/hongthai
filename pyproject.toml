[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hongthai"
version = "0.1.0"
description = "桃園、松山、高雄、香港、澳門機場的強風停飛風險預報資料管線"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "ecmwf-opendata>=0.3.34",
    "cfgrib>=0.9.14",
    "xarray>=2024.6",
    "eccodes>=2.37",
    "numpy>=1.26",
    "requests>=2.31",
    "pillow>=10.4",  # 分享預覽圖（HD1）
    "fonttools>=4.53",  # 分享預覽圖的字型 cmap、tools/make_font_subset.py
    "anthropic>=1.15.0",  # AI 對決（HD5）：Claude
    "google-genai>=2.31.0",  # AI 對決（HD5）：Gemini（Vertex AI）
    "google-auth>=2.62.0",  # AI 對決（HD5）：Vertex 的服務帳號
    "google-cloud-bigquery>=3.46",  # WeatherNext 3（HD15）：BigQuery
    "gcsfs>=2026.9",  # WeatherNext 3（HD15）：GCS Zarr 備援與海平面氣壓
    "zarr>=3.1",  # WeatherNext 3 的 Zarr v3
    "opencc>=1.1.9",  # HD29：中國氣象局預警簡轉繁（s2twp、s2hk）；PyPI 有 manylinux wheel
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

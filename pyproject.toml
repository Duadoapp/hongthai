[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hongthai"
version = "0.1.0"
description = "桃園、松山、高雄、香港、澳門機場的強風停飛風險預報資料管線"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "ecmwf-opendata>=0.3.34",
    "cfgrib>=0.9.14",
    "xarray>=2024.6",
    "eccodes>=2.37",
    "numpy>=1.26",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

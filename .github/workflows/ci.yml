name: ci

on:
  pull_request:
  push:
    branches: [main]

# S1 L24：這支只讀程式碼、跑測試，不需要寫入
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-24.04 # ubuntu-latest 2026-10-19 起換成 26.04；eccodes 與 Python 套件在新版確認過再換
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 裝 eccodes
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libeccodes-dev

      # S1 M5：照帶 hash 的 lock 檔裝（README「相依套件」）；測試從 src/ 跑（pyproject 的 pythonpath）
      - name: 裝套件
        run: pip install --require-hashes -r requirements-dev.txt

      - name: ruff
        run: |
          ruff check .
          ruff format --check .

      - name: pytest
        run: pytest -q

  # HD25：Cloudflare 排程 Worker（cloudflare/trigger/，自己一份 package.json 與 lock）。
  # 只在 cloudflare/ 有變動時跑：cron → workflow 的對照測試、wrangler 打包（--dry-run，不用帳號）
  trigger-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare/trigger
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: 有沒有動到 cloudflare/
        id: changed
        working-directory: .
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # 新分支的第一次 push（before 全是 0）或找不到 base 時照跑
          if ! git cat-file -e "${BASE}^{commit}" 2> /dev/null \
            || git diff --name-only "$BASE" HEAD | grep -q '^cloudflare/'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "cloudflare/ 沒有變動，跳過"
          fi

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: steps.changed.outputs.run == 'true'
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cloudflare/trigger/package-lock.json

      - name: npm ci
        if: steps.changed.outputs.run == 'true'
        run: npm ci --no-audit --no-fund

      - name: 測試
        if: steps.changed.outputs.run == 'true'
        run: npm test

      - name: wrangler 打包（--dry-run）
        if: steps.changed.outputs.run == 'true'
        run: npm run check

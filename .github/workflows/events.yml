name: events

# 事件保存（HD20，颱風 29W 驗證）：每小時存機場 METAR、JMA／JTWC 颱風現報、五個機場的逐班航班紀錄（HD31）
# 到 data 分支的 history/events/<id>/。期間（events.json 的 from～to，台灣日期）外 `hourly` 印一行就結束、不推。
# 手動跑時勾 backfill：把 history/ 裡期間內已經過去的報搬進 history/events/<id>/（已存在的跳過）；
# 勾 backfill-tracks（HD21）：從 2026-10-19T00:00Z 起的快照補抽各模式的颱風路徑到
# history/events/<id>/tracks/（已存在的跳過；GFS、AIGFS 從 AWS 重抓海平面氣壓、IFS／AIFS 從 ECMWF
# 開放資料抓，拿不到的記 log）；接著補 WeatherNext 3（HD15：起報 ≤ 現在 − 121 小時、CC BY 4.0 的報，事件檔
# history/events/<id>/wn3/ 與路徑；要 Google 服務帳號，還沒核准時第一報 403 就停）；
# 勾 backfill-metar（HD25）：從 2026-10-19T00:00Z 起把 AviationWeather 還有的 METAR 補進
# history/events/<id>/metar/（已有的不覆蓋，補進來的行多 "backfill"；金門、馬祖是氣象署觀測，補不到只記 log）；
# 勾 backfill-flights（HD31）：香港 past?date= 從 2026-10-19 起每天補逐班航班紀錄到 history/events/<id>/flights/
# （同一班同狀態不重寫，補進來的行多 "backfill": true；其他四個機場只有當天，補不到只記 log）。
# HD32：每小時的航班另外存 TDX 台灣十個機場（source: "tdx"），要 secrets TDX_CLIENT_ID／TDX_CLIENT_SECRET，
# 沒設就跳過（log 記「TDX 未設定」），其他照跑。
# HD25：整點的排程由 Cloudflare 排程 Worker（cloudflare/trigger/）用 workflow_dispatch 觸發
# （trigger: cloudflare），下面的 cron 留著當備援；不做跳過檢查（多跑一次只是去重）。
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      trigger:
        description: "誰觸發的：手動按的維持 manual；cloudflare 是排程 Worker 帶的（只記在 log，不跳過）"
        type: choice
        options: [manual, cloudflare]
        default: manual
      backfill:
        description: "把期間內已經過去的報搬進 history/events/<id>/"
        type: boolean
        default: false
      backfill-tracks:
        description: "補抽 2026-10-19T00:00Z 以後各報的颱風路徑（history/events/<id>/tracks/）"
        type: boolean
        default: false
      backfill-metar:
        description: "補 2026-10-19T00:00Z 以後缺的 METAR（AviationWeather 最多往回 30 天；history/events/<id>/metar/）"
        type: boolean
        default: false
      backfill-flights:
        description: "補 2026-10-19 起香港的逐班航班紀錄（history/events/<id>/flights/；其他機場只有當天）"
        type: boolean
        default: false

permissions:
  contents: write # 推 data 分支

concurrency:
  group: events
  cancel-in-progress: false

jobs:
  events:
    runs-on: ubuntu-24.04
    timeout-minutes: 45 # 每小時的只要 1 分鐘；手動 backfill-tracks 每報約 1 分鐘下載＋解析，WN3 每報一個 BigQuery 查詢＋21 張氣壓（HD15 前 30、HD20 是 10）
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # hongthai.events 的每小時不用 eccodes（不 import 模式來源），只裝 requests 省時間；
      # backfill-tracks 要解析 GRIB／BUFR，裝 eccodes 與整個套件（同 build.yml）
      - name: 裝套件
        if: "!(github.event_name == 'workflow_dispatch' && inputs.backfill-tracks)"
        run: pip install requests

      - name: 裝套件（backfill-tracks）
        if: github.event_name == 'workflow_dispatch' && inputs.backfill-tracks
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libeccodes-dev
          pip install .

      - name: 取出 data 分支
        run: |
          git fetch --depth=1 origin data:data
          git worktree add data data

      - name: 搬過去的報（手動、backfill）
        if: github.event_name == 'workflow_dispatch' && inputs.backfill
        env:
          PYTHONPATH: src
        run: python -m hongthai.events backfill --archive data

      - name: 補颱風路徑（手動、backfill-tracks）
        if: github.event_name == 'workflow_dispatch' && inputs.backfill-tracks
        env:
          PYTHONPATH: src
          # HD15：WeatherNext 3 補報用 build.yml 同一把服務帳號
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          WN3_BQ_TABLE: ${{ vars.WN3_BQ_TABLE }}
        run: python -m hongthai.events backfill-tracks --archive data --from 2026-10-19T00:00Z

      - name: 補 METAR 缺口（手動、backfill-metar）
        if: github.event_name == 'workflow_dispatch' && inputs.backfill-metar
        env:
          PYTHONPATH: src
        run: python -m hongthai.events backfill-metar --archive data --from 2026-10-19T00:00Z

      - name: 補香港航班（手動、backfill-flights）
        if: github.event_name == 'workflow_dispatch' && inputs.backfill-flights
        env:
          PYTHONPATH: src
        run: python -m hongthai.events backfill-flights --archive data --from 2026-10-19

      - name: 每小時 METAR、颱風現報與航班
        env:
          PYTHONPATH: src
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          # HD32：TDX 航空即時航班（OAuth2 client credentials）；沒設就跳過
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
          TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || inputs.trigger || 'manual' }}
        run: |
          echo "觸發：$TRIGGER"
          python -m hongthai.events hourly --archive data

      - name: 推 data 分支
        working-directory: data
        run: ../tools/push_data.sh events

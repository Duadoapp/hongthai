name: build

on:
  schedule:
    # 依實測的出爐時間（2026-10-17／18，UTC）排：
    # - ECMWF 開放資料 HRES（全部步長）：00Z ≈ 07:35、06Z ≈ 12:30、12Z ≈ 19:35、18Z ≈ 00:30
    # - ECMWF 系集機率（10fgg*，只有 00／12Z）：00Z ≈ 08:00、12Z ≈ 20:00
    # - GFS 到 f120（AWS 鏡像／NOMADS）：00Z ≈ 03:40、06Z ≈ 09:40、12Z ≈ 15:40、18Z ≈ 21:40
    # GitHub 排程常延遲 5–30 分鐘，所以抓在出爐後約 20–30 分鐘、避開整點。
    # HD25：2026-10-20～21 實測 GitHub 排程晚到 2–5 小時，改由 Cloudflare 排程 Worker（cloudflare/trigger/，
    # 同樣四個時間）用 workflow_dispatch 觸發（trigger: cloudflare）；這裡的 cron 留著當備援。
    # 兩邊都觸發時，後到的那個在 build.py 開頭發現這個時段已經出過就跳過（docs/cloudflare-trigger.md）。
    - cron: "25 8 * * *" # EC 00Z（HRES＋系集）、GFS 00Z
    - cron: "5 13 * * *" # EC 06Z HRES＋00Z 系集、GFS 06Z
    - cron: "25 20 * * *" # EC 12Z（HRES＋系集）、GFS 12Z
    - cron: "5 1 * * *" # EC 18Z HRES＋12Z 系集、GFS 18Z
  workflow_dispatch:
    inputs:
      trigger:
        description: "誰觸發的：手動按的維持 manual（一律照跑）；cloudflare 是排程 Worker 帶的（這個時段出過就跳過）"
        type: choice
        options: [manual, cloudflare]
        default: manual
      ai:
        description: "AI 評論（HD50）：auto 照時段（早上 09:05 那報評；21:05 那報有颱風而且有高才評，其他不評）；on 一律評；off 一律不評"
        type: choice
        options: [auto, "on", "off"]
        default: auto

# S1 L25（HD45）：頂層只給讀；兩個 job 各自宣告。
# - build：拿來源與 AI 的 secrets，token 只能讀——相依套件被動手腳時拿不到可寫 repo 的 token 與 Pages 的 OIDC token
# - publish：拿可寫 repo 的 token 與 Pages 的 OIDC token，沒有來源與 AI 的 secrets、不裝套件、不跑這個 repo 的 Python
# 兩個 job 之間只靠 artifact 傳：data 分支的變更（patch）與 Pages 目錄。公開 repo 的 artifact 登入就能下載，所以
# 裡面只能有本來就要公開的檔（README「WeatherNext 3」：未來時段的數值只寫私人 bucket，不落地到 data/、public/）
permissions:
  contents: read

# 整個 run（兩個 job）同一組：build 與 publish 之間不會被另一次 build 插隊推 data
concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04 # ubuntu-latest 2026-10-19 起換成 26.04；eccodes 與 Python 套件在新版確認過再換
    timeout-minutes: 55 # 「產生 latest.json」45 分鐘＋其他步驟（2026-10-25 前 42、HD15 前 40、HD16 前 38、HD21 前 35、HD14 前 30、HD12 前 28）；HD45 起推 data 與 Pages 在 publish（另外 15 分鐘）；排程間隔至少 4.5 小時，不會重疊
    permissions:
      contents: read
    env:
      PYTHONPATH: src # S1 M5：不 pip install 專案本身
    outputs:
      packed: ${{ steps.pack.outputs.packed }}
      pages: ${{ steps.pack.outputs.pages }}
    steps:
      # HD25：job 開始的時間（含排隊等 concurrency），timing/ 的 startedAt、delayMinutes 用
      - name: 記開始時間
        run: echo "JOB_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 裝 eccodes
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libeccodes-dev

      # S1 M5：照帶 hash 的 lock 檔裝（README「相依套件」），不裝專案本身：程式從 src/ 跑（job 的 PYTHONPATH）
      - name: 裝套件
        run: pip install --require-hashes -r requirements.txt

      - name: 取出 data 分支（歷史紀錄與上一份 latest.json）
        run: |
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git fetch --depth=1 origin data:data
            git worktree add data data
          else
            git worktree add --orphan -b data data
          fi
          du -sh data

      - name: 產生 latest.json
        id: build
        continue-on-error: true
        # 每個來源有自己的時間預算（src/hongthai/build.py 的 BUDGET_S，總和 29.75 分鐘，HD5 加 ai 180 秒、HD12 再加 60 秒、
        # HD14 加 aifs 180＋aigfs 120 秒、HD21 加 tracks 150 秒、HD9 加 jma 45 秒、HD16 加 openmeteo 90 秒、HD15 加 wn3
        # 120 秒），超時的來源記 ok:false 繼續跑；這裡是整步的保險（總和 1785 秒＋2.25 分鐘餘裕，HD15 前 30 分鐘、HD16 前
        # 28 分鐘、HD21 前 25 分鐘、HD14 前 20 分鐘、HD12 前 18 分鐘）。
        # 被砍時已寫的 history/timing/ 照樣推上去
        timeout-minutes: 45 # 2026-10-25 由 32 放寬：預算總和 1,910 秒已逼近 32 分鐘（README「時間預算」）
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          # AI 對決（HD5）；GOOGLE_SERVICE_ACCOUNT_JSON 是服務帳號金鑰 JSON 整份原文
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT }}
          GOOGLE_CLOUD_LOCATION: ${{ secrets.GOOGLE_CLOUD_LOCATION }}
          # WeatherNext 3（HD15）用同一把服務帳號（上面兩個）；開關是 repo 的 Variables（不是 secret），
          # 沒設就是 src/hongthai/config.py 的預設（HD43 起 WN3_MODE=vote、WN3_VOTING 投；設成 private
          # 會變回只旁觀、不投票）。WN3_PUBLIC_LEVEL（HD48）沒設就公開 WN3 每格自己的整體等級，設 0 關掉
          # （輸出和 HD43 一樣）。
          # WN3_BQ_TABLE 沒設就用 <GOOGLE_CLOUD_PROJECT>.weathernext_3.weathernext_3_0_0_0p1deg；
          # WN3_PRIVATE_BUCKET（HD15b 隱形旁觀的私人 bucket）沒設就用 <GOOGLE_CLOUD_PROJECT>-wn3-private
          WN3_MODE: ${{ vars.WN3_MODE }}
          WN3_VOTING: ${{ vars.WN3_VOTING }}
          WN3_PUBLIC_LEVEL: ${{ vars.WN3_PUBLIC_LEVEL }}
          WN3_BQ_TABLE: ${{ vars.WN3_BQ_TABLE }}
          WN3_PRIVATE_BUCKET: ${{ vars.WN3_PRIVATE_BUCKET }}
          # WN3_VIA：auto（預設，BigQuery 失敗退 Zarr）／zarr（不查 BigQuery）／bigquery（不退 Zarr）
          WN3_VIA: ${{ vars.WN3_VIA }}
          # HD38：TDX 航空即時航班（台中、台南、花蓮、台東、澎湖、金門、馬祖南竿的取消統計），和 events.yml
          # 同一組 secrets；沒設就跳過（sources.tdx 記 not_configured），其他照跑
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
          # HD25：GitHub 排程是 schedule、Worker 帶 cloudflare、手動按的是 manual。前兩個這個時段已經出過就
          # 跳過（不產生 public/latest.json，publish 的 Pages 那一步自動不跑；推 data 分支只推 timing/ 那一行 skip）
          TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || inputs.trigger || 'manual' }}
          # HD50：AI 評論照時段（auto）；手動按的可以選 on／off。排程與 Worker 不帶這個輸入＝auto
          AI_MODE: ${{ inputs.ai || 'auto' }}
        run: python -m hongthai.build --out public --archive data --trigger "$TRIGGER" --ai "$AI_MODE"

      # HD45：data 分支的變更包成 patch 給 publish 推（這個 job 的 token 只能讀）。worktree 裡可能有刪檔、搬檔，
      # 所以 `git add -A` 後整份 diff（--binary、不偵測改名：刪＋加，套用最單純）；base 是取出時的 commit（還沒有
      # data 分支時是空的），tree 是加完之後的樹，publish 套用後要對得上。被砍或失敗時已寫的 history/timing/ 照樣包
      - name: 包 data 分支的變更
        id: pack
        if: always()
        env:
          OUT: ${{ runner.temp }}/data-changes
          HAS_PAGES: ${{ hashFiles('public/latest.json') != '' }}
        run: |
          set -eu
          mkdir -p "$OUT"
          cd data
          git add -A
          git rev-parse --verify --quiet HEAD > "$OUT/base" || : > "$OUT/base"
          git write-tree > "$OUT/tree"
          git -c core.quotePath=false diff --cached --binary --full-index --no-renames --no-color \
            --no-ext-diff --no-textconv > "$OUT/data.patch"
          git diff --cached --shortstat
          ls -l "$OUT"
          echo "packed=true" >> "$GITHUB_OUTPUT"
          echo "pages=$HAS_PAGES" >> "$GITHUB_OUTPUT"

      - name: 上傳 data 變更（artifact，留 1 天）
        if: always() && steps.pack.outputs.packed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: data-changes
          path: ${{ runner.temp }}/data-changes
          if-no-files-found: error
          retention-days: 1

      # 名稱 github-pages（deploy-pages 預設找這個）；這一步不需要 pages 權限，只是一般的 artifact
      - name: 上傳 Pages artifact（留 1 天）
        if: hashFiles('public/latest.json') != ''
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
          retention-days: 1

      - name: 流程失敗時標紅
        if: steps.build.outcome != 'success'
        run: |
          echo "::error::python -m hongthai.build 失敗（已改發布上一份 latest.json，或沒有可發布的）"
          exit 1

  # HD45：只做發布。沒有來源與 AI 的 secrets、不裝 Python 套件、不執行這個 repo 的 Python 程式；
  # artifact 的內容當資料處理（base、tree 先檢查格式，patch 只用 git apply 套在 data 的 worktree 裡）
  publish:
    needs: build
    # build 失敗（改發布上一份）或被砍時照樣推已寫的 data（原本「推 data 分支」的 if: always()）
    if: always() && needs.build.outputs.packed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15 # 平常約 1–2 分鐘；推 data 最多重試 4 次（各隔 20 秒）、deploy-pages 自己最多等 10 分鐘
    permissions:
      contents: write # 把歷史紀錄推到 data 分支
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # 只用裡面的 tools/push_data.sh 與 git 的設定（推 data 用的 token）；Python 程式取出來但不執行
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 下載 data 變更
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: data-changes
          path: ${{ runner.temp }}/data-changes

      # 在 build 取出時的那個 commit 上還原 build 的 worktree（同一棵樹，patch 一定套得上），之後照舊交給
      # push_data.sh：commit、rebase 到遠端最新的 data（build 期間 events.yml／longrange.yml 先推的）、重試
      - name: 還原 data 分支的變更
        env:
          IN: ${{ runner.temp }}/data-changes
        run: |
          set -eu
          base=$(cat "$IN/base")
          tree=$(cat "$IN/tree")
          if ! [[ "$tree" =~ ^[0-9a-f]{40}$ && "$base" =~ ^([0-9a-f]{40})?$ ]]; then
            echo "::error::artifact 的 base／tree 格式不對"
            exit 1
          fi
          if [ -n "$base" ]; then
            git fetch --depth=1 origin "$base"
            git worktree add -B data data "$base"
          else
            git worktree add --orphan -b data data
          fi
          cd data
          if [ -s "$IN/data.patch" ]; then
            git apply --index --binary --whitespace=nowarn "$IN/data.patch"
          fi
          if [ "$(git write-tree)" != "$tree" ]; then
            echo "::error::套用 patch 之後的樹和 build 的不一樣"
            exit 1
          fi
          git diff --cached --shortstat

      - name: 推 data 分支
        working-directory: data
        # events.yml（HD20，每小時）也會推 data 分支：先 rebase 到遠端最新的、失敗重試 3 次
        run: ../tools/push_data.sh data

      - name: 發布到 GitHub Pages
        id: deploy
        if: needs.build.outputs.pages == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
